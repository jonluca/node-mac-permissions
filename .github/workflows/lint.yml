name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22 --force
      - name: Lint
        run: |
          yarn install
          yarn lint
